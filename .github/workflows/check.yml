# Every push and pull request: the HTML validates and every internal path
# (stylesheet, script, images, PDF) resolves. Nothing is built or deployed
# here; GitHub Pages serves main as it is.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: HTML validates
        run: npx --yes html-validate@9.5.4 index.html 404.html
      - name: Internal paths resolve
        run: npx --yes linkinator@6.1.2 ./index.html ./404.html --skip "^https?://(?!localhost)"
